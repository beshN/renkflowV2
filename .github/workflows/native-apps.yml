name: Native Field Apps
on:
  workflow_dispatch:
  pull_request:
    paths: ['apps/native-*/**', 'apps/web/lib/features/field/**', 'apps/web/app/api/v1/field/**', 'apps/web/app/api/mobile/**', 'apps/web/lib/features/mobile/**', 'contracts/mobile/**', 'scripts/generate-mobile-contract.py', 'scripts/mobile/**', 'scripts/generate-native-ios-project.py', '.github/workflows/native-apps.yml']
  push:
    branches: ['main', 'codex/mobile-integration']
    paths: ['apps/native-*/**', 'apps/web/lib/features/mobile/**', 'apps/web/app/api/mobile/**', 'contracts/mobile/**', 'scripts/mobile/**', '.github/workflows/native-apps.yml']
env:
  RENKFLOW_TEST_DB_PORT: 55434
# Fork pull requests never run on the self-hosted Mac (each job's `if`); actions are pinned to SHAs.
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
# No actions cache (as in validate.yml): the self-hosted runner keeps ~/.npm between runs, and the
# post-job upload of that cache to GitHub took 17 minutes per job, holding the only runner.
# GitHub-hosted runners are unavailable for this account; like validate.yml, every job runs on
# the self-hosted Mac. Jobs there share one machine, so each stops only its own tracked fixture processes.
jobs:
  mobile-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --workspaces=false --legacy-peer-deps
      - name: Check generated contract and web compatibility
        run: |
          python3 ../../scripts/mobile/check-resources.py
          python3 ../../scripts/generate-mobile-contract.py
          git diff --exit-code -- ../native-android/app/src/main/java/com/renkflow/field/data/MobileContract.kt ../native-ios/RenkflowField/Core/MobileContract.swift
          npm run type-check
  android:
    needs: ios
    if: (always()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/native-android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Stop owned fixture processes
        if: always()
        run: python3 ../../scripts/mobile/fixture-processes.py stop
      - name: Start isolated local web contract server
        working-directory: apps/web
        run: |
          npm ci --workspaces=false --legacy-peer-deps
          bash ../../scripts/mobile/prepare-http-fixture.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew --no-watch-fs :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Test native Android UI and encrypted persistence
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          working-directory: apps/native-android
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          disk-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            ./gradlew --no-watch-fs :app:connectedDebugAndroidTest
            mkdir -p app/build/screenshots
            adb pull /sdcard/renkflow-field-login.png app/build/screenshots/android-login.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Renkflow-Saha-Android
          path: |
            apps/native-android/app/build/outputs/apk/debug/*.apk
            apps/native-android/app/build/reports/
            apps/native-android/app/build/screenshots/
      - name: Stop owned fixture processes
        if: always()
        run: python3 ../../scripts/mobile/fixture-processes.py stop
  ios:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/native-ios
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Stop owned fixture processes
        if: always()
        run: python3 ../../scripts/mobile/fixture-processes.py stop
      - name: Start isolated local web contract server
        working-directory: apps/web
        run: |
          npm ci --workspaces=false --legacy-peer-deps
          bash ../../scripts/mobile/prepare-http-fixture.sh
      - name: Validate generated project
        run: |
          python3 ../../scripts/generate-native-ios-project.py
          git diff --exit-code RenkflowField.xcodeproj
      - name: Select iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          data = json.load(open('/tmp/simulators.json'))
          import os, subprocess
          phones = [(runtime, d) for runtime, devices in data['devices'].items() for d in devices if 'iPhone' in d['name'] and d['isAvailable']]
          if not phones: raise SystemExit('No iPhone simulator available')
          runtime, phone = phones[0]
          device = subprocess.check_output(['xcrun', 'simctl', 'create', 'RenkFlow CI ' + os.environ['GITHUB_RUN_ID'], phone['deviceTypeIdentifier'], runtime], text=True).strip()
          print('FIELD_SIMULATOR=' + device)
          PY
      - name: Build and test native iOS app
        run: xcodebuild test -project RenkflowField.xcodeproj -scheme RenkflowField -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 60 -destination "platform=iOS Simulator,id=$FIELD_SIMULATOR" -resultBundlePath build/FieldTests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="$PWD/RenkflowField/Simulator.entitlements"
      - name: Export iOS screenshots
        if: always()
        run: |
          if [ -d build/FieldTests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/FieldTests.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Renkflow-Saha-iOS-Tests
          path: |
            apps/native-ios/build/FieldTests.xcresult
            apps/native-ios/build/screenshots/
      - name: Stop owned fixture processes and simulator
        if: always()
        run: |
          python3 ../../scripts/mobile/fixture-processes.py stop
          if [ -n "${FIELD_SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$FIELD_SIMULATOR" || true
            xcrun simctl delete "$FIELD_SIMULATOR"
          fi
