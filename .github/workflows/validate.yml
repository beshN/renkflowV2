name: Validate Web App

on:
  workflow_dispatch:
    inputs:
      release_database:
        description: Run the reviewed release database audit after validation
        type: boolean
        default: false
      apply_database_migrations:
        description: Take an encrypted backup and apply migrations (requires release_database)
        type: boolean
        default: false
  pull_request:
    branches:
      - main
      - codex/mobile-integration
      - claude/trello-odoo
      - claude/night-2
      - claude/n3-ai-assistant
  push:
    branches:
      - codex/**

permissions:
  contents: read

# Aynı dalda yeni bir push gelince eski çalışma iptal olur; ayrıca aynı dal için hem `push` hem
# `pull_request` çalışması tetiklenirse biri öbürünü iptal eder (Actions dakikası boşa gitmez).
concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && 'release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/web ci --workspaces=false --legacy-peer-deps

      - name: Run backend and frontend validation gate
        run: npm --prefix apps/web run validate

  release-database:
    if: github.event_name == 'workflow_dispatch' && inputs.release_database
    needs: validate
    uses: ./.github/workflows/release-database.yml
    with:
      apply: ${{ inputs.apply_database_migrations }}
    secrets: inherit
