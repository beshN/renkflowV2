name: Validate Web App

on:
  pull_request:
    branches:
      - main
      - codex/mobile-integration
      - claude/trello-odoo
      - claude/night-2
      - claude/n3-ai-assistant
  push:
    branches:
      # main too: two PRs that pass on their own can still break each other once both are merged.
      - main
      - codex/**

# Aynı dalda yeni bir push gelince eski çalışma iptal olur; ayrıca aynı dal için hem `push` hem
# `pull_request` çalışması tetiklenirse biri öbürünü iptal eder (Actions dakikası boşa gitmez).
# Jobs run on GitHub-hosted Ubuntu runners. Pull requests from forks remain excluded
# by each job's `if` condition.
# Actions are pinned to commit SHAs; Dependabot keeps the pins current.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/web ci --workspaces=false --legacy-peer-deps

      # __tests__/lib/einvoice-xsd.test.ts validates UBL-TR XML with xmllint (libxml2); the Mac runner
      # had it, the Ubuntu image does not.
      - name: Install xmllint for e-invoice schema tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libxml2-utils

      - name: Run backend and frontend validation gate
        run: npm --prefix apps/web run validate

      - name: Install Chromium for PDF fixtures
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Every scripts/test-*.ts against a fresh throwaway PostgreSQL (temp dir, free port, no remote URL).
      # Each script has its own 180 s limit (scripts/run-integration-tests.ts), so a hang is reported by name.
      - name: Integration tests on an isolated local database
        timeout-minutes: 15
        run: npm --prefix apps/web run test:integration

  # Critical production advisories block; high ones are reported as warnings.
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Same lockfile the deploy installs from (apps/web/package-lock.json, workspaces off); no install needed.
      - name: Audit production dependencies
        # Critical production advisories fail the check; high ones only warn (fix them in a dependency PR).
        run: |
          npm --prefix apps/web audit --omit=dev --audit-level=critical --workspaces=false
          if ! npm --prefix apps/web audit --omit=dev --audit-level=high --workspaces=false > /dev/null; then
            echo "::warning title=npm audit::Production dependencies have high advisories; see this job's log and fix them in a dependency PR."
          fi
