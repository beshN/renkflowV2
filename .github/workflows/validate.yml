name: Validate Web App

on:
  pull_request:
    branches:
      - main
      - claude/trello-odoo
      - claude/night-2
      - claude/n3-ai-assistant
  push:
    branches:
      - codex/**

jobs:
  validate:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/web ci --workspaces=false --legacy-peer-deps

      - name: Run backend and frontend validation gate
        run: npm --prefix apps/web run validate
