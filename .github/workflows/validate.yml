name: Validate Web App

on:
  pull_request:
    branches:
      - main
      - codex/mobile-integration
      - claude/trello-odoo
      - claude/night-2
      - claude/n3-ai-assistant
  push:
    branches:
      # main too: two PRs that pass on their own can still break each other once both are merged.
      - main
      - codex/**

# Aynı dalda yeni bir push gelince eski çalışma iptal olur; ayrıca aynı dal için hem `push` hem
# `pull_request` çalışması tetiklenirse biri öbürünü iptal eder (Actions dakikası boşa gitmez).
# The repository is public and these jobs run on the owner's own Mac (self-hosted runner). Pull
# requests from forks never run there (see each job's `if`): their code would execute on that machine.
# Actions are pinned to commit SHAs; Dependabot keeps the pins current.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        # No actions cache: the self-hosted runner keeps ~/.npm between runs, and uploading the
        # cache to GitHub after every run took several minutes.
        with:
          node-version: 22

      - name: Install dependencies
        run: npm --prefix apps/web ci --workspaces=false --legacy-peer-deps

      - name: Run backend and frontend validation gate
        run: npm --prefix apps/web run validate

      # Every scripts/test-*.ts against a fresh throwaway PostgreSQL (temp dir, free port, no remote URL).
      # The PDF fixture uses the Chromium already in the runner's Playwright cache; `playwright install`
      # hung on this runner, so it is not run here (install it on the runner once when Playwright updates).
      # Each script has its own 180 s limit (scripts/run-integration-tests.ts), so a hang is reported by name.
      - name: Integration tests on an isolated local database
        timeout-minutes: 15
        run: npm --prefix apps/web run test:integration

  # Critical production advisories block; high ones are reported as warnings.
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Same lockfile the deploy installs from (apps/web/package-lock.json, workspaces off); no install needed.
      - name: Audit production dependencies
        # Critical production advisories fail the check; high ones only warn (fix them in a dependency PR).
        run: |
          npm --prefix apps/web audit --omit=dev --audit-level=critical --workspaces=false
          if ! npm --prefix apps/web audit --omit=dev --audit-level=high --workspaces=false > /dev/null; then
            echo "::warning title=npm audit::Production dependencies have high advisories; see this job's log and fix them in a dependency PR."
          fi

  e2e:
    # Public browser tests run without deployment credentials or external services.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/renkflow_e2e
      ALLOW_LOCAL_DATABASE: '1'
      ALLOW_INSECURE_HTTP: '1'
      AUTH_TRUST_HOST: 'true'
      AUTH_SECRET: e2e-only-not-a-production-secret-32-chars
      AUTH_URL: http://localhost:4173
      NEXT_PUBLIC_APP_URL: http://localhost:4173
      PUBLIC_SITE_MODE: 'off'
      E2E_INCLUDE_PRIVATE: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --workspaces=false --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # finance.spec.ts explicitly skips private flows: they require seeded tenant/auth/DB
      # fixtures. Public auth tests only render forms; no login/signup or provider calls.
      - name: Run existing public E2E tests (private fixture-dependent flows skipped)
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
