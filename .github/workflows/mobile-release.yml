name: Mobile Release Packages
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios, both]
        default: both
        description: Build signed packages; no store upload
permissions:
  contents: read
  actions: read
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require successful native tests for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/native-apps.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=5" > /tmp/native-runs.json
          python3 - <<'PY'
          import json
          if not json.load(open('/tmp/native-runs.json'))['workflow_runs']:
              raise SystemExit('Run Native Field Apps successfully on this commit before signing packages.')
          PY
  android:
    needs: verified
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: apps/native-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Decode upload keystore outside repository
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          data=os.environ.get('ANDROID_KEYSTORE_BASE64')
          if not data: raise SystemExit('ANDROID_KEYSTORE_BASE64 is not configured. No signed package was created.')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'field-release.keystore'
          path.write_bytes(base64.b64decode(data,validate=True));path.chmod(0o600)
          PY
      - name: Build signed Play internal-testing AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/field-release.keystore"
          export MOBILE_BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-watch-fs --no-daemon :app:bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RenkFlow-Saha-Play-Internal-AAB
          path: apps/native-android/app/build/outputs/bundle/release/app-release.aab
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/field-release.keystore"
  ios:
    needs: verified
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/native-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Import distribution certificate and App Store profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib
          for key,name in [('IOS_CERTIFICATE_BASE64','field.p12'),('IOS_PROFILE_BASE64','field.mobileprovision')]:
              value=os.environ.get(key)
              if not value: raise SystemExit(key+' is not configured. No signed archive was created.')
              path=pathlib.Path(os.environ['RUNNER_TEMP'])/name
              path.write_bytes(base64.b64decode(value,validate=True));path.chmod(0o600)
          PY
          task_password=$(openssl rand -hex 24)
          echo "::add-mask::$task_password"
          task_keychain="$RUNNER_TEMP/field-signing.keychain-db"
          security create-keychain -p "$task_password" "$task_keychain"
          security set-keychain-settings -lut 21600 "$task_keychain"
          security unlock-keychain -p "$task_password" "$task_keychain"
          security import "$RUNNER_TEMP/field.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$task_keychain" > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$task_password" "$task_keychain" > /dev/null
          security list-keychains -d user -s "$task_keychain"
          security cms -D -i "$RUNNER_TEMP/field.mobileprovision" > "$RUNNER_TEMP/field-profile.plist"
          task_profile=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/field-profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/field.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$task_profile.mobileprovision"
          echo "IOS_PROFILE_UUID=$task_profile" >> "$GITHUB_ENV"
      - name: Archive and export TestFlight-ready IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          test -n "$IOS_TEAM_ID" || { echo 'IOS_TEAM_ID is not configured'; exit 1; }
          python3 ../../scripts/generate-native-ios-project.py
          task_build=$((100000 + GITHUB_RUN_NUMBER))
          xcodebuild archive -project RenkflowField.xcodeproj -scheme RenkflowField -destination 'generic/platform=iOS' -archivePath build/RenkFlow.xcarchive CURRENT_PROJECT_VERSION="$task_build" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" CODE_SIGN_IDENTITY='Apple Distribution' CODE_SIGN_ENTITLEMENTS= > "$RUNNER_TEMP/field-archive.log" 2>&1 || { echo 'iOS archive failed. No IPA was produced.'; exit 1; }
          python3 - <<'PY'
          import os,plistlib
          with open('/tmp/field-export.plist','wb') as file:
              plistlib.dump({'method':'app-store-connect','teamID':os.environ['IOS_TEAM_ID'],'signingStyle':'manual','signingCertificate':'Apple Distribution','provisioningProfiles':{'com.renkflow.field':os.environ['IOS_PROFILE_UUID']},'manageAppVersionAndBuildNumber':False},file)
          PY
          xcodebuild -exportArchive -archivePath build/RenkFlow.xcarchive -exportPath build/ipa -exportOptionsPlist /tmp/field-export.plist > "$RUNNER_TEMP/field-export.log" 2>&1 || { echo 'iOS export failed. No IPA was produced.'; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RenkFlow-Saha-TestFlight-IPA
          path: apps/native-ios/build/ipa/*.ipa
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/field-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/field.p12" "$RUNNER_TEMP/field.mobileprovision" "$RUNNER_TEMP/field-profile.plist"
          if [ -n "${IOS_PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"; fi
