name: Vercel deployment checks
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci --workspaces=false --legacy-peer-deps
      - run: npm --prefix apps/web run validate
# Vercel Git integration builds previews and production from apps/web.
# No application credentials or production DB access belong in this workflow.
# Run additive DB migrations as an explicit release step, never inside next build.
