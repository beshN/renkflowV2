<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Renkflow Kayıt Ol Sayfası</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0db9f2",
            "background-light": "#f5f8f8",
            "background-dark": "#101e22",
            "text-light": "#0d181c",
            "text-dark": "#f5f8f8",
            "subtle-light": "#49879c",
            "subtle-dark": "#a0b8c0",
            "border-light": "#cee2e8",
            "border-dark": "#34454b",
            "surface-light": "#ffffff",
            "surface-dark": "#192c32"
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark">
<div class="relative flex min-h-screen w-full flex-col group/design-root">
<div class="absolute top-0 right-0 p-6 z-10">
<div class="flex items-center gap-4">
<p class="text-sm text-subtle-light dark:text-subtle-dark hidden sm:block">Zaten bir hesabın var mı?</p>
<button class="flex cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-white dark:bg-surface-dark text-text-light dark:text-text-dark text-sm font-bold leading-normal tracking-[0.015em] border border-border-light dark:border-border-dark shadow-sm">
<span class="truncate">Giriş Yap</span>
</button>
</div>
</div>
<div class="flex flex-1 w-full">
<div class="flex-1 lg:flex-[0.5] flex flex-col items-center justify-center p-4 sm:p-6 md:p-8">
<div class="flex w-full max-w-md flex-col justify-center gap-6">
<header class="flex flex-col gap-3 text-center lg:text-left">
<h1 class="text-3xl sm:text-4xl font-black leading-tight tracking-[-0.033em]">Renkflow'a Hoş Geldiniz</h1>
<p class="text-subtle-light dark:text-subtle-dark text-base font-normal leading-normal">Projelerinizi organize etmeye başlayın</p>
</header>
<div class="flex w-full flex-col gap-3">
<button class="flex h-12 w-full min-w-[84px] cursor-pointer items-center justify-center gap-3 overflow-hidden rounded-lg bg-white dark:bg-surface-dark px-5 text-sm font-bold leading-normal tracking-[0.015em] border border-border-light dark:border-border-dark shadow-sm">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="truncate">Google ile devam et</span>
</button>
<button class="flex h-12 w-full min-w-[84px] cursor-pointer items-center justify-center gap-3 overflow-hidden rounded-lg bg-white dark:bg-surface-dark px-5 text-sm font-bold leading-normal tracking-[0.015em] border border-border-light dark:border-border-dark shadow-sm">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
<path d="M1 1h9v9H1V1zm10 0h9v9h-9V1zM1 11h9v9H1v-9zm10 11h9v-9h-9v9z"></path>
</svg>
<span class="truncate">Microsoft ile devam et</span>
</button>
</div>
<div class="flex items-center gap-2">
<hr class="flex-1 border-t border-border-light dark:border-border-dark"/>
<p class="text-subtle-light dark:text-subtle-dark text-sm font-normal leading-normal text-center">veya</p>
<hr class="flex-1 border-t border-border-light dark:border-border-dark"/>
</div>
<form class="flex w-full flex-col gap-4">
<div class="flex flex-col sm:flex-row gap-4">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-sm font-medium leading-normal pb-2">Ad Soyad</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-12 placeholder:text-subtle-light dark:placeholder:text-subtle-dark px-3.5 py-2.5 text-base font-normal leading-normal" placeholder="Adınızı ve soyadınızı girin" value=""/>
</label>
</div>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-sm font-medium leading-normal pb-2">E-posta Adresi</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-12 placeholder:text-subtle-light dark:placeholder:text-subtle-dark px-3.5 py-2.5 text-base font-normal leading-normal" placeholder="ornek@eposta.com" type="email" value=""/>
</label>
<label class="flex flex-col min-w-40 flex-1">
<p class="text-sm font-medium leading-normal pb-2">Şifre</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark h-12 placeholder:text-subtle-light dark:placeholder:text-subtle-dark px-3.5 py-2.5 text-base font-normal leading-normal pr-10" placeholder="En az 8 karakter" type="password" value=""/>
<button class="absolute inset-y-0 right-0 flex items-center pr-3 text-subtle-light dark:text-subtle-dark" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</label>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] w-full mt-2 shadow-sm">
<span class="truncate">Hesap Oluştur</span>
</button>
</form>
<p class="text-xs text-center text-subtle-light dark:text-subtle-dark">
            Kaydol'a tıklayarak Renkflow'un
            <a class="underline hover:text-primary" href="#">Kullanıcı Sözleşmesini</a>
            ve
            <a class="underline hover:text-primary" href="#">Gizlilik Politikasını</a>
            kabul etmiş olursunuz.
          </p>
</div>
</div>
<div class="hidden lg:flex flex-1 items-center justify-center bg-primary/10 dark:bg-primary/20 p-8">
<div class="w-full max-w-lg aspect-square rounded-2xl bg-gradient-to-br from-primary/70 to-primary/40 dark:from-primary/50 dark:to-primary/30 p-8 shadow-2xl">
<div class="w-full h-full rounded-lg bg-white/20 dark:bg-black/10 backdrop-blur-sm flex items-center justify-center">
<p class="text-3xl font-bold text-white opacity-80">Renkflow</p>
</div>
</div>
</div>
</div>
</div>
</body></html>
