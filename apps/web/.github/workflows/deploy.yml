name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: europe-west3 # Frankfurt
  REPOSITORY: renkflow-repo
  SERVICE: renkflow-v2-web
  REGION: europe-west3

jobs:
  deploy:
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Create Artifact Registry Repository
        # Create repository if it doesn't exist (idempotent-ish check)
        run: |
          gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=${{ env.GAR_LOCATION }} \
            --description="Docker repository for RenkFlow V2" \
            || echo "Repository likely already exists"

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" -f apps/web/Dockerfile .
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: '--port=3000 --allow-unauthenticated --add-cloudsql-instances=${{ secrets.GCP_SQL_INSTANCE }}'
          env_vars: |-
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=https://${{ env.SERVICE }}-${{ env.PROJECT_ID }}.a.run.app 
            # Note: NEXTAUTH_URL needs to be the actual Cloud Run URL. We might need to set it dynamically or use a fixed custom domain.
            # Only define NEXTAUTH_URL if NOT using Vercel (which we aren't).
            # For now, let's assume auto-generated URL or user updates it later.
            # Better strategy: Dont set NEXTAUTH_URL here, let NextAuth detect it (trust host).
            AUTH_TRUST_HOST=true

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
